name: Update Profile Assets

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile source
        uses: actions/checkout@v7

      - name: Generate snake game SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate public GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for name in (
              "github-contribution-grid-snake.svg",
              "github-contribution-grid-snake-dark.svg",
              "github-stats.svg",
          ):
              path = Path("dist") / name
              root = ElementTree.parse(path).getroot()
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise ValueError(f"{path} is not an SVG image")
              print(f"Validated {path} ({path.stat().st_size} bytes)")
          PY

      - name: Save generated assets for review and publishing
        uses: actions/upload-artifact@v7
        with:
          name: profile-assets
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out existing output branch
        uses: actions/checkout@v7
        with:
          ref: output

      - name: Download validated assets
        uses: actions/download-artifact@v8
        with:
          name: profile-assets
          path: generated

      - name: Commit and publish updated assets
        run: |
          cp generated/*.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg github-stats.svg
          if git diff --cached --quiet; then
            echo "Profile assets are already up to date."
            exit 0
          fi
          git commit -m "chore: update profile assets"
          git push origin HEAD:output
